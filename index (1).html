<style>
/* Layout: sticky top bar, centred 1120px column; hero splits text left / portrait right and stacks on phones.
   Admin is a sidebar on desktop and a scrolling tab strip on phones. Palette follows the brief exactly. */
:root{
  --bg:#070B19; --indigo:#10132B; --card:#0D1224; --card2:#121733;
  --purple:#8B5CF6; --purple-deep:#7C3AED; --violet:#A855F7; --magenta:#D946EF;
  --fg:#F8FAFC; --fg2:#AAB1C5; --soft:#C4B5FD;
  --line:rgba(170,177,197,.16); --line2:rgba(139,92,246,.35);
  --ok:#34D399; --warn:#FBBF24; --crit:#FB7185;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;margin:0;
  background-image:radial-gradient(900px 480px at 85% -80px,rgba(139,92,246,.20),transparent 70%),radial-gradient(600px 400px at -10% 30%,rgba(217,70,239,.07),transparent 70%);
  background-repeat:no-repeat}
a{color:var(--soft)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.ic{width:18px;height:18px;flex:none}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:6px}
.sr{position:absolute;left:-9999px}
.skip{position:absolute;left:12px;top:-60px;background:var(--purple-deep);color:#fff;padding:8px 14px;border-radius:8px;z-index:50}
.skip:focus{top:12px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(7,11,25,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;color:var(--fg);text-decoration:none;white-space:nowrap}
.brand i{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--purple),var(--magenta));display:block;transform:rotate(45deg)}
.brand span{color:var(--soft)}
.nav{display:flex;gap:2px;margin-inline:auto;overflow:hidden}
.nav a{color:var(--fg2);text-decoration:none;font-size:14px;padding:8px 10px;border-radius:8px;transition:color .2s,background .2s;white-space:nowrap}
.nav a:hover{color:var(--fg);background:rgba(139,92,246,.12)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto}
.nav+.seg{margin-left:0}
.seg button{font:inherit;font-size:13px;font-weight:500;color:var(--fg2);background:none;border:0;padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--purple-deep);color:#fff}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--fg);border-radius:10px;width:40px;height:36px;cursor:pointer;align-items:center;justify-content:center}
.mnav{display:none;border-top:1px solid var(--line);padding:8px 20px 14px;background:var(--bg)}
.mnav a{display:block;padding:11px 4px;color:var(--fg2);text-decoration:none;border-bottom:1px solid var(--line)}
@media (max-width:1020px){.nav{display:none}.burger{display:inline-flex}.mnav.open{display:block}.topbar .wrap{gap:10px}.burger{margin-left:auto}.seg{margin-left:0}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:15px;font-weight:600;padding:11px 18px;border-radius:11px;border:1px solid var(--line2);background:transparent;color:var(--fg);text-decoration:none;cursor:pointer;transition:transform .15s,background .2s,border-color .2s;min-height:44px}
.btn:hover{background:rgba(139,92,246,.14);border-color:var(--purple)}
.btn.primary{background:linear-gradient(135deg,var(--purple-deep),#9333EA);border-color:transparent;color:#fff;box-shadow:0 8px 28px -10px rgba(139,92,246,.7)}
.btn.primary:hover{transform:translateY(-1px);background:linear-gradient(135deg,#8B4DF5,#A23BEE)}
.btn.sm{padding:7px 12px;font-size:13px;min-height:34px;border-radius:9px}
.btn.danger{border-color:rgba(251,113,133,.45);color:var(--crit)}
.btn.danger:hover{background:rgba(251,113,133,.1);border-color:var(--crit)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:var(--line)}

/* hero */
.hero{padding-block:72px 40px}
.hero .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.hero h1{font-size:clamp(2.6rem,6.4vw,4.6rem);font-weight:700;margin:14px 0 18px}
.hero h1 em{font-style:normal;background:linear-gradient(120deg,#C4B5FD,var(--violet) 55%,var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:var(--fg2);font-size:18px;max-width:54ch}
.meta{display:flex;flex-wrap:wrap;gap:10px 22px;margin:22px 0 28px;color:var(--fg2);font-size:14.5px}
.meta b{color:var(--fg);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.portrait{position:relative;justify-self:end;width:100%;max-width:400px}
.portrait::before{content:"";position:absolute;inset:-1px;border-radius:26px;background:linear-gradient(160deg,rgba(168,85,247,.7),rgba(139,92,246,.05) 45%,rgba(217,70,239,.35));z-index:0}
.frame{position:relative;z-index:1;aspect-ratio:4/5;border-radius:25px;margin:1px;background:var(--card);overflow:hidden;display:grid;place-items:center;box-shadow:0 30px 80px -30px rgba(139,92,246,.55)}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.ph{text-align:center;padding:24px;color:var(--fg2)}
.ph .mono{font-family:var(--display);font-size:84px;font-weight:700;color:rgba(196,181,253,.35);line-height:1}
.ph p{font-size:13.5px;margin-top:10px;max-width:24ch;margin-inline:auto}
@media (max-width:820px){
  .hero{padding-block:36px 24px}
  .hero .wrap{grid-template-columns:1fr;gap:28px}
  .portrait{order:-1;max-width:240px;justify-self:start}
}

/* hub cards */
.hub{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-block:8px 24px}
.hubc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:6px;transition:border-color .2s,transform .2s}
.hubc:hover{border-color:var(--line2);transform:translateY(-2px)}
.hubc h3{font-size:17px;display:flex;justify-content:space-between;align-items:center}
.hubc h3 .ic{color:var(--soft)}
.hubc small{color:var(--fg2);font-size:13.5px}
@media (max-width:820px){.hub{grid-template-columns:1fr 1fr}}

/* sections */
section.sec{padding-block:64px;border-top:1px solid var(--line);scroll-margin-top:70px}
.sechead{display:flex;flex-direction:column;gap:8px;margin-bottom:28px;max-width:60ch}
.sechead h2{font-size:clamp(1.7rem,3.6vw,2.4rem);font-weight:700}
.sechead p{color:var(--fg2)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-size:19px}
.card .sum{color:var(--fg2);font-size:14.5px}
.card .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--mono);font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--fg2)}
.tag.on{border-color:var(--line2);color:var(--soft);background:rgba(139,92,246,.10)}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.pill.ok{background:rgba(52,211,153,.12);color:var(--ok)}
.pill.warn{background:rgba(251,191,36,.12);color:var(--warn)}
.pill.mute{background:rgba(170,177,197,.12);color:var(--fg2)}
.pill.pur{background:rgba(139,92,246,.18);color:var(--soft)}
.pill.crit{background:rgba(251,113,133,.12);color:var(--crit)}
.empty{border:1px dashed var(--line2);border-radius:16px;padding:28px;color:var(--fg2);background:rgba(13,18,36,.55);display:flex;flex-direction:column;gap:6px}
.empty b{color:var(--fg);font-family:var(--display);font-size:17px;font-weight:500}
.skillgrp{margin-bottom:22px}
.skillgrp h3{font-size:15px;color:var(--soft);font-family:var(--mono);font-weight:500;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
.skill{display:inline-flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 8px 8px 0;vertical-align:top}
.skill span{font-size:12px;color:var(--fg2)}
.tl{display:flex;flex-direction:column;gap:14px}
.edu{display:grid;gap:6px}
.contact-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
footer.foot{border-top:1px solid var(--line);padding-block:30px;color:var(--fg2);font-size:14px}
footer.foot .wrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
footer.foot nav{display:flex;gap:16px;flex-wrap:wrap}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(3,5,14,.78);z-index:60;display:grid;place-items:center;padding:16px;overflow:auto}
.dlg{background:var(--card);border:1px solid var(--line2);border-radius:20px;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:0 40px 100px -30px rgba(139,92,246,.5)}
.dlg.sm{max-width:440px}
.dlg header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dlg h2{font-size:26px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.shot-empty{aspect-ratio:16/10;border:1px dashed var(--line2);border-radius:10px;display:grid;place-items:center;color:var(--fg2);font-size:13px;text-align:center;padding:10px}
.sub{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}

/* admin */
.banner{background:rgba(139,92,246,.10);border:1px solid var(--line2);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--fg2);margin-block:20px 0}
.banner b{color:var(--fg)}
.adm{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;padding-block:24px 60px}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(76px + env(safe-area-inset-top,0px));align-self:start}
.side button{font:inherit;text-align:left;background:none;border:0;color:var(--fg2);padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.side button:hover{background:rgba(139,92,246,.10);color:var(--fg)}
.side button[aria-current=true]{background:rgba(139,92,246,.18);color:var(--fg)}
.side .cnt{font-family:var(--mono);font-size:12px;color:var(--fg2)}
@media (max-width:820px){
  .adm{grid-template-columns:minmax(0,1fr);gap:16px}
  .side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px}
  .side button{white-space:nowrap;border:1px solid var(--line)}
}
.ahead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.ahead h2{font-size:28px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--fg2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.panel h3{font-size:17px;margin-bottom:10px}
.todo{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.todo li{display:flex;gap:10px;align-items:center;color:var(--fg2);font-size:15px}
.todo .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center}
.todo li.done{color:var(--fg)}
.todo li.done .dot{background:var(--ok);border-color:var(--ok);color:#06210f}
.todo .ic{width:12px;height:12px}
.meter{height:8px;border-radius:99px;background:rgba(170,177,197,.14);overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--magenta));min-width:2px}
.rows{display:flex;flex-direction:column;gap:10px}
.rowi{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.rowi .t{min-width:0;flex:1 1 220px}
.rowi .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.rowi .t span{font-size:13.5px;color:var(--fg2)}
.rowi .ac{display:flex;gap:8px;flex-wrap:wrap}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
form.f .full{grid-column:1/-1}
@media (max-width:640px){form.f{grid-template-columns:1fr}}
label.l{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--fg2);min-width:0}
label.l small{color:var(--fg2);opacity:.8;font-size:12.5px}
input,select,textarea{font:inherit;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%;min-height:44px}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--violet);outline-offset:1px;border-color:transparent}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--purple)}
input[type=file]{padding:9px}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--fg)}
.fact{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:6px}
.sug{display:flex;flex-wrap:wrap;gap:8px}
.sugi{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-size:14px}
.sugi.approved{border-color:var(--ok)}
.sugi.rejected{opacity:.45;text-decoration:line-through}
.sugi button{font:inherit;border:0;border-radius:999px;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;background:rgba(170,177,197,.12);color:var(--fg)}
.sugi button.y:hover{background:rgba(52,211,153,.25)}
.sugi button.n:hover{background:rgba(251,113,133,.25)}
.steps{display:flex;gap:8px;margin-bottom:16px;font-family:var(--mono);font-size:12.5px;color:var(--fg2)}
.steps span{padding:4px 10px;border:1px solid var(--line);border-radius:99px}
.steps .on{border-color:var(--purple);color:var(--fg)}
.alert{border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.08);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--warn)}
.err{color:var(--crit);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);color:var(--fg);padding:12px 18px;border-radius:12px;z-index:80;font-size:14.5px;max-width:calc(100% - 32px);box-shadow:0 14px 40px -12px rgba(0,0,0,.7)}
.toast.bad{border-color:var(--crit)}
.toast.good{border-color:var(--ok)}
.thumb{width:84px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.shots{display:flex;flex-wrap:wrap;gap:8px}
.shots figure{margin:0;position:relative}
.shots button{position:absolute;top:-6px;right:-6px;border:0;background:var(--crit);color:#1b0710;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;cursor:pointer;padding:0}
.shots button .ic{width:12px;height:12px}
</style>
<style>[hidden]{display:none!important}img{max-width:100%}</style>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IC={
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
 down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
 gh:'<path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>',
 li:'<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2zM4 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>',
 up:'<path d="M12 20V9M7 13l5-5 5 5M5 4h14"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
 copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
 eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'
};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
let _id=100;const nid=()=>++_id;
const fmtDate=d=>{if(!d)return'';const t=new Date(d);return isNaN(t)?esc(d):t.toLocaleDateString('en-IN',{month:'short',year:'numeric'})};
const fmtSize=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const csv=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const MB=1048576;

/* ---------- state (lives in this page only; Stage 2 moves it to Supabase) ---------- */

let toastT;
function toast(msg,kind){const h=$('#toast-host');h.innerHTML=`<div class="toast ${kind||''}" role="status">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>h.innerHTML='',3800)}
function render(){

function adminBody(){

    const k=S.edit.kind;
    return k==='cert'?certForm():k==='project'?projectForm():k==='exp'?expForm():k==='ach'?achForm():skillForm();
  }
  return {overview,certs:certList,projects:projList,exp:expList,ach:achList,skills:skillList,resume:resumeAdmin,profile:profileAdmin}[S.tab]();

function fld(name,label,val,o={}){
  const id='f_'+name,t=o.type||'text',h=o.hint?`<small>${esc(o.hint)}</small>`:'';
  const cls='l'+(o.full?' full':'');
  if(o.area)return `<label class="${cls}" for="${id}" ${o.full?'style="grid-column:1/-1"':''}>${esc(label)}<textarea id="${id}" name="${name}" ${o.ph?`placeholder="${esc(o.ph)}"`:''}>${esc(val)}</textarea>${h}</label>`;
  if(o.opts)return `<label class="l" for="${id}">${esc(label)}<select id="${id}" name="${name}"><option value="">Not set</option>${o.opts.map(x=>{const v=Array.isArray(x)?x[0]:x,tx=Array.isArray(x)?x[1]:x;return `<option value="${esc(v)}" ${v===val?'selected':''}>${esc(tx)}</option>`}).join('')}</select>${h}</label>`;
  return `<label class="${cls}" for="${id}" ${o.full?'style="grid-column:1/-1"':''}>${esc(label)}<input id="${id}" name="${name}" type="${t}" value="${esc(val)}" ${o.ph?`placeholder="${esc(o.ph)}"`:''} ${o.req?'required':''} ${o.acc?`accept="${o.acc}"`:''}>${h}</label>`;
}
function overview(){

  const used=files.reduce((a,f)=>a+(f.size||0),0);
  const drafts=S.certs.filter(c=>c.status!=='published').length+S.projects.filter(p=>!p.published).length+S.exp.filter(e=>!e.published).length+S.ach.filter(a=>!a.published).length;
  const pub=pubCerts().length+pubProjects().length+pubExp().length+pubAch().length;
  const steps=[[!!S.profile.photo,'Upload your professional photo'],[!!S.profile.bio,'Write your About text'],[S.resume.published,'Upload and publish your resume'],[pubCerts().length>0,'Add your first certificate and review its skills'],[S.projects.some(p=>p.summary),'Complete a starter project with a summary and screenshots'],[pubSkills().length>0,'Add the skills you want to show']];
  return `<div class="ahead"><h2>Overview</h2><button class="btn primary" data-act="mode" data-m="site">${ic('eye')}Preview public site</button></div>
  <div class="stats"><div class="stat"><b>${pub}</b><span>Published items</span></div><div class="stat"><b>${drafts}</b><span>Drafts</span></div><div class="stat"><b>${S.certs.length}</b><span>Certificates</span></div><div class="stat"><b>${S.projects.length}</b><span>Projects</span></div></div>
  <div class="panel"><h3>Set up your portfolio</h3><ul class="todo">${steps.map(s=>`<li class="${s[0]?'done':''}"><span class="dot">${s[0]?ic('check'):''}</span>${s[1]}</li>`).join('')}</ul></div>
  <div class="panel"><h3>Storage</h3><p class="sum" style="color:var(--fg2)">Files added in this preview: ${files.length} (${fmtSize(used)}). Upload limits in this preview: 10 MB for certificates and images, 5 MB for the resume.</p><div class="meter" role="img" aria-label="Preview storage used"><i style="width:${Math.min(100,used/(50*MB)*100)}%"></i></div>
  <p class="sum" style="color:var(--fg2);font-size:14px">When connected to Supabase, the free plan has included about 1 GB of file storage, a 500 MB database and a 50 MB per-file limit. Check supabase.com/pricing for current figures before relying on them.</p></div>`;

/* --- certificate vault --- */
function certList(){
  const f=S.filter,q=f.q.toLowerCase();
  const issuers=[...new Set(S.certs.map(c=>c.issuer))];
  const l=S.certs.filter(c=>(!q||(c.title+c.issuer+c.tags+approved(c).map(s=>s.name).join(' ')).toLowerCase().includes(q))&&(!f.issuer||c.issuer===f.issuer)&&(!f.status||c.status===f.status));
  return `<div class="ahead"><h2>Certificate Vault</h2><button class="btn primary" data-act="new" data-k="cert">${ic('plus')}Add certificate</button></div>
  <div class="tools"><label class="sr" for="cq">Search</label><input id="cq" data-act="filter" data-k="q" style="max-width:260px" placeholder="Search title, issuer, skill" value="${esc(f.q)}">
  <label class="sr" for="ci">Issuer</label><select id="ci" data-act="filter" data-k="issuer" style="max-width:200px"><option value="">All issuers</option>${issuers.map(i=>`<option ${f.issuer===i?'selected':''}>${esc(i)}</option>`).join('')}</select>
  <label class="sr" for="cs">Status</label><select id="cs" data-act="filter" data-k="status" style="max-width:160px"><option value="">Any status</option><option value="draft" ${f.status==='draft'?'selected':''}>Draft</option><option value="published" ${f.status==='published'?'selected':''}>Published</option></select></div>
  ${!S.certs.length?empty('No certificates yet','Add one with a PDF, PNG or JPG file. You review the text and skills before anything goes public.'):!l.length?empty('No matches','Change the search or filters.'):`<div class="rows">${l.map(c=>`<div class="rowi"><div class="t"><b>${esc(c.title)}</b><span>${esc(c.issuer)}${c.date?' · '+fmtDate(c.date):''}${c.file?' · '+esc(c.file.name):''} · ${approved(c).length} approved skill${approved(c).length===1?'':'s'}</span></div><span class="pill ${c.status==='published'?'ok':'mute'}">${c.status==='published'?'Published':'Draft'}</span>
  <div class="ac"><button class="btn sm" data-act="toggle" data-k="cert" data-id="${c.id}">${c.status==='published'?'Unpublish':'Publish'}</button><button class="btn sm" data-act="edit" data-k="cert" data-id="${c.id}">${ic('edit')}Edit</button><button class="btn sm danger" data-act="ask" data-k="cert" data-id="${c.id}" aria-label="Delete ${esc(c.title)}">${ic('trash')}</button></div></div>`).join('')}</div>`}`;
}
const approved=c=>(c.skills||[]).filter(s=>s.state==='approved');
function certForm(){
  const d=S.edit.draft,st=d.step;

/* ---------- logic ---------- */
function blank(k){
  return {
   cert:{step:1,title:'',issuer:'',date:'',credId:'',verifyUrl:'',description:'',category:'',tags:'',file:null,text:'',skills:[],status:'draft'},
   project:{title:'',summary:'',problem:'',solution:'',tech:'',live:'',repo:'',status:'',category:'',tags:'',video:'',caption:'',post:'',images:[],published:false},
   exp:{org:'',role:'',type:'applied',start:'',end:'',desc:'',skills:'',link:'',published:false},
   ach:{title:'',event:'',date:'',desc:'',link:'',file:null,published:false},
   skill:{name:'',cat:SKILL_CATS[0],stage:STAGES[0],desc:'',links:[],pub:true}
  }[k];
}
const COL={cert:'certs',project:'projects',exp:'exp',ach:'ach',skill:'skills'};
function findItem(k,id){return S[COL[k]].find(x=>x.id===id)}
function toDraft(k,it){
  const d=JSON.parse(JSON.stringify(it,(key,v)=>key==='file'||key==='images'?undefined:v));
  if(k==='cert'){d.step=1;d.file=it.file;d.skills=(it.skills||[]).map(s=>({...s}))}
  if(k==='project'){d.tech=it.tech.join(', ');d.tags=it.tags.join(', ');d.images=it.images.slice()}
  if(k==='ach')d.file=it.file;
  return d;
}
function readForm(form){
  const d=S.edit.draft,fd=new FormData(form);
  for(const [k,v] of fd.entries()){if(k.startsWith('link_'))continue;if(typeof v==='string')d[k]=v}
  ['published','pub'].forEach(b=>{if(b in d&&form.querySelector(`[name=${b}]`))d[b]=form.querySelector(`[name=${b}]`).checked});
  if(S.edit.kind==='skill'){d.links=[...form.querySelectorAll('[name^=link_]')].filter(x=>x.checked).map(x=>x.name.slice(5))}
}
function captureAny(){const f=$('form[data-form]');if(f&&S.edit)readForm(f);const t=$('#f_text');if(t&&S.edit&&S.edit.kind==='cert')S.edit.draft.text=t.value}
function checkFile(f,types,max){
  if(!f)return 'No file chosen.';
  if(!types.includes(f.type))return `${f.name} is not an accepted file type. Choose ${types.map(t=>t.split('/')[1].toUpperCase().replace('JPEG','JPG')).join(', ')}.`;
  if(f.size>max)return `${f.name} is ${fmtSize(f.size)}. The limit is ${fmtSize(max)}. Compress it and try again.`;
  return '';
}
const mk=f=>({name:f.name,size:f.size,type:f.type,url:URL.createObjectURL(f)});
function suggest(text){
  const t=' '+text.toLowerCase().replace(/[^a-z0-9+#./ ]/g,' ')+' ';const out=new Set();
  VOCAB.forEach(v=>{if(t.includes(v.toLowerCase()))out.add(v)});
  Object.keys(SYN).forEach(k=>{if(t.includes(' '+k+' '))out.add(SYN[k])});
  return [...out];
}
function genCaption(d){
  const tech=csv(d.tech),tags=csv(d.tags);
  const L=[`I built ${d.title||'a new project'}${d.summary?': '+d.summary:'.'}`];
  if(d.problem)L.push('','The problem: '+d.problem);
  if(d.solution)L.push('','What it does: '+d.solution);
  if(tech.length)L.push('','Built with: '+tech.join(', '));
  if(d.live)L.push('','Try it: '+d.live);
  if(d.repo)L.push('Code: '+d.repo);
  L.push('','Feedback is welcome.');
  if(tags.length)L.push('',tags.map(t=>'#'+t.replace(/[^A-Za-z0-9]/g,'')).filter(t=>t.length>1).join(' '));
  return L.join('\n');
}
function saveItem(k){
  const d=S.edit.draft,id=S.edit.id,col=S[COL[k]];
  let item;
  if(k==='project'){item={...d,tech:csv(d.tech),tags:csv(d.tags)}}
  else if(k==='cert'){item={...d,status:d.status}}
  else item={...d};
  delete item.step;delete item.err;delete item.dup;
  if(id){const i=col.findIndex(x=>x.id===id);item.id=id;col[i]=item}else{item.id=nid();col.push(item)}
  S.edit=null;render();toast('Saved.','good');
}
function copyText(txt){
  const fallback=()=>{const t=$('#f_caption');if(t){t.focus();t.select()}toast('Press and hold or use Ctrl+C to copy the selected text.')};
  try{navigator.clipboard.writeText(txt).then(()=>toast('Caption copied.','good'),fallback)}catch(e){fallback()}
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=+el.dataset.id,k=el.dataset.k;
  if(a==='scrim'){if(e.target===el){S.del=null;S.view=null;render()}return}
  if(a==='filter')return;
  if(a==='goto'){e.preventDefault();S.menu=false;const go=()=>{const t=document.getElementById(el.dataset.t);if(t)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})};if(S.mode!=='site'){S.mode='site';render()}else if($('.mnav.open')){render()}go();return}
  if(a==='mode'){S.mode=el.dataset.m;S.menu=false;S.edit=null;render();scrollTo(0,0);return}
  if(a==='menu'){S.menu=!S.menu;render();return}
  if(a==='noresume'){toast('No resume is published yet. Upload one in Admin, Resume.');return}
  if(a==='tab'){S.tab=el.dataset.t;S.edit=null;render();return}
  if(a==='proj'){S.view=id;render();return}
  if(a==='close'){S.view=null;render();return}
  if(a==='new'){S.edit={kind:k,id:null,draft:blank(k)};render();scrollTo(0,0);return}
  if(a==='edit'){S.edit={kind:k,id,draft:toDraft(k,findItem(k,id))};render();scrollTo(0,0);return}
  if(a==='cancel'){S.edit=null;render();return}
  if(a==='ask'){const it=findItem(k,id);S.del={k,id,label:it.title||it.name||it.role||'This item'};render();setTimeout(()=>{const b=$('#delyes');if(b)b.focus()});return}
  if(a==='delno'){S.del=null;render();return}
  if(a==='delyes'){const c=S[COL[S.del.k]];c.splice(c.findIndex(x=>x.id===S.del.id),1);S.del=null;render();toast('Deleted.','good');return}
  if(a==='toggle'){const it=findItem(k,id);if(k==='cert')it.status=it.status==='published'?'draft':'published';else if(k==='skill')it.pub=!it.pub;else it.published=!it.published;render();toast('Updated.','good');return}
  if(k==='cert'||a==='suggest'||a==='skst'||a==='addsk'||a==='certback'||a==='certsave'){
    if(a==='suggest'){captureAny();const d=S.edit.draft;const found=suggest(d.text);if(!found.length)toast('No known skill names found in that text. You can add skills manually.');found.forEach(n=>{if(!d.skills.some(s=>s.name.toLowerCase()===n.toLowerCase()))d.skills.push({name:n,state:'pending',src:'suggested'})});render();return}
    if(a==='skst'){captureAny();S.edit.draft.skills[+el.dataset.i].state=el.dataset.s;render();return}
    if(a==='addsk'){captureAny();const i=$('#f_man'),n=i.value.trim();if(!n){toast('Type a skill name first.','bad');return}const d=S.edit.draft;if(d.skills.some(s=>s.name.toLowerCase()===n.toLowerCase())){toast('That skill is already in the list.','bad');return}d.skills.push({name:n,state:'approved',src:'manual'});render();return}
    if(a==='certback'){captureAny();S.edit.draft.step=1;render();return}
    if(a==='certsave'){captureAny();const d=S.edit.draft;d.skills=d.skills.filter(s=>s.state!=='pending'||true);d.status=el.dataset.s;saveItem('cert');return}
  }
  if(a==='rmimg'){captureAny();const d=S.edit.draft,im=d.images.splice(+el.dataset.i,1)[0];if(im&&im.url.startsWith('blob:'))URL.revokeObjectURL(im.url);render();return}
  if(a==='gencap'){captureAny();S.edit.draft.caption=genCaption(S.edit.draft);render();toast('Caption generated. Edit it as you like.');return}
  if(a==='copycap'){captureAny();const c=S.edit.draft.caption;if(!c){toast('Generate or write a caption first.','bad');return}copyText(c);return}
  if(a==='respub'){S.resume.published=!S.resume.published;render();toast(S.resume.published?'Resume published.':'Resume unpublished.','good');return}
  if(a==='resdel'){S.resume={url:'',name:'',size:0,published:false};render();toast('Resume removed.','good');return}
  if(a==='rmphoto'){S.profile.photo=null;render();return}
});
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-act=filter]');if(!el)return;
  S.filter[el.dataset.k]=el.value;
  const pos=el.selectionStart;render();
  const n=document.getElementById(el.id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches('select[data-act=filter]')){S.filter[el.dataset.k]=el.value;render();return}
  const a=el.dataset&&el.dataset.act,f=el.files&&el.files[0];
  if(!a||!el.files)return;
  if(a==='certfile'){captureAny();const d=S.edit.draft,er=checkFile(f,['application/pdf','image/png','image/jpeg'],10*MB);d.err=er;if(!er){d.file=mk(f);d.dup='';d.dupOk=false}render();return}
  if(a==='achfile'){captureAny();const d=S.edit.draft,er=checkFile(f,['application/pdf','image/png','image/jpeg'],10*MB);d.err=er;if(!er)d.file=mk(f);render();return}
  if(a==='projimg'){captureAny();const d=S.edit.draft;const errs=[];[...el.files].forEach(x=>{const er=checkFile(x,['image/png','image/jpeg','image/webp'],10*MB);if(er)errs.push(er);else d.images.push(mk(x))});d.err=errs.join(' ');render();return}
  if(a==='resfile'){const er=checkFile(f,['application/pdf'],5*MB);if(er){toast(er,'bad');el.value='';return}S.resume={url:URL.createObjectURL(f),name:f.name,size:f.size,published:false};render();toast('Resume uploaded. Publish it when ready.','good');return}
  if(a==='photo'){const er=checkFile(f,['image/png','image/jpeg','image/webp'],5*MB);if(er){toast(er,'bad');el.value='';return}const r=new FileReader();r.onload=()=>{S.profile.photo=r.result;S.profile.photoSize=f.size;render();toast('Photo updated. Check it on the public site.','good')};r.onerror=()=>toast('The photo could not be read. Try another file.','bad');r.readAsDataURL(f);return}
});
document.addEventListener('submit',e=>{
  const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();
  const t=form.dataset.form;
  if(t==='profile'){const fd=new FormData(form);['bio','email','linkedin','github'].forEach(k=>S.profile[k]=String(fd.get(k)||'').trim());render();toast('Profile saved.','good');return}
  readForm(form);const d=S.edit.draft;
  const req={cert1:['title','issuer'],project:['title'],exp:['org','role'],ach:['title'],skill:['name']}[t];
  const miss=req.filter(k=>!String(d[k]||'').trim());
  if(miss.length){toast('Fill in the required fields: '+miss.join(', ')+'.','bad');const i=form.querySelector(`[name=${miss[0]}]`);if(i)i.focus();return}
  if(t==='cert1'){
    const dup=S.certs.find(c=>c.id!==S.edit.id&&((d.file&&c.file&&c.file.name===d.file.name&&c.file.size===d.file.size)||(d.credId&&c.credId&&c.credId===d.credId)));
    if(dup&&!d.dupOk){d.dup=`This looks like a duplicate of "${dup.title}".`;d.dupOk=true;render();return}
    d.dup='';d.step=2;render();scrollTo(0,0);return
  }
  saveItem({project:'project',exp:'exp',ach:'ach',skill:'skill'}[t]);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.view||S.del)){S.view=null;S.del=null;render()}});
render();
</script>

</body>
</html>
